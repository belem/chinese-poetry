# poem-source ⇄ belem/chinese-poetry 同步
# 两端只维护 develop：直接 commit，不走 PR。

# 密钥仓库里的凭据文件（Web 端维护，禁止本地克隆/推送）。
# 必须写在顶层：.cnb.yml 里的 ${VAR} 在解析期（读配置时）就展开，
# 只在任务 env 里定义的变量此时还不存在，会被展开成空串
# → prepare 失败（Invalid file resource）或注入不到凭据。
SECRETS_SLUG: npu-gpu-cpu/poem-source-secrets
SECRETS_REF: main
SECRETS_FILE: pair.yml

$:
  env:
    SYNC_BRANCH: develop
    GITHUB_SLUG: belem/chinese-poetry
  # 同步只是几次 git 操作，给最小规格就够
  runner:
    cpus: 1

develop:
  # 本仓库有新提交 → 直接推到 GitHub 的 develop
  push:
    - name: cnb-to-github
      imports:
        - https://cnb.cool/npu-gpu-cpu/poem-source-secrets/-/blob/main/pair.yml
      stages:
        - name: 推送到 GitHub
          script: bash .cnb/sync/sync.sh push

  # 反向兜底：GitHub 侧的提交每 6 小时合回来一次
  "crontab: 0 0,6,12,18 * * *":
    - name: github-to-cnb
      imports:
        - https://cnb.cool/npu-gpu-cpu/poem-source-secrets/-/blob/main/pair.yml
      stages:
        - name: 从 GitHub 拉取
          script: bash .cnb/sync/sync.sh pull

  # 需要立刻对齐时手动跑：MODE=push / pull / both
  api_trigger:
    - name: manual-sync
      imports:
        - https://cnb.cool/npu-gpu-cpu/poem-source-secrets/-/blob/main/pair.yml
      stages:
        - name: 双向同步
          script: bash .cnb/sync/sync.sh "${MODE:-both}"
