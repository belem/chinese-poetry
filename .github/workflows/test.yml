name: Test

# 默认分支是 develop：这里原写 master，push 和 PR 都匹配不上，
# 单元测试在实际开发分支上从来没跑过（data-quality.yml 也不跑 pytest）。
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.x'
        architecture: 'x64'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
    - name: Run unit tests
      run: |
        pytest
      
